<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>c2c-conv</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤡</text></svg>">
<style>
  :root {
    --bg: #100e17;
    --panel: #1a1624;
    --panel-2: #221c30;
    --line: #362c4a;
    --text: #f4efff;
    --muted: #9a90b0;

    --nose: #ff2e4c;
    --face: #ffd93d;
    --wig-1: #ff2e4c;
    --wig-2: #ff9f1c;
    --wig-3: #ffe14d;
    --wig-4: #3ddc84;
    --wig-5: #2ec4ff;
    --wig-6: #a06bff;

    --rainbow: linear-gradient(90deg,
      var(--wig-1), var(--wig-2), var(--wig-3),
      var(--wig-4), var(--wig-5), var(--wig-6), var(--wig-1));
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px ui-sans-serif, system-ui, sans-serif;
  }

  /* Polka dots, because the whole point is that we are clowns. */
  .dots {
    background-image: radial-gradient(var(--dot, #ffffff0d) 1.5px, transparent 1.6px);
    background-size: 14px 14px;
  }

  header {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px 13px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 3px;
    background: var(--rainbow);
    background-size: 220% 100%;
    animation: wig 14s linear infinite;
  }
  @keyframes wig { to { background-position: 220% 0; } }

  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .brand .name { color: var(--text); }
  .brand .name b { color: var(--nose); font-weight: 800; }
  .brand .clown { font-size: 19px; line-height: 1; }
  .brand .clown.mirror { transform: scaleX(-1); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid var(--line);
    background: var(--panel-2);
    white-space: nowrap;
  }
  .badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
  }
  .badge.gallery { color: var(--face); border-color: #6b5a12; }
  .badge.yolo {
    color: #fff;
    background: var(--nose);
    border-color: var(--nose);
    box-shadow: 0 0 0 0 #ff2e4c88;
    animation: honk 1.6s ease-out infinite;
  }
  @keyframes honk {
    0%   { box-shadow: 0 0 0 0 #ff2e4c99; }
    70%  { box-shadow: 0 0 0 9px #ff2e4c00; }
    100% { box-shadow: 0 0 0 0 #ff2e4c00; }
  }
  .badge.link { color: var(--wig-4); }
  .badge.link.down { color: var(--muted); }

  .spacer { flex: 1; }

  .who {
    width: 150px;
    flex: none;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
  }
  .who:focus { outline: none; border-color: var(--wig-5); }

  #screen {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding: 6px 8px;
    background: #0b0910;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* An id selector's display beats the [hidden] attribute, so hiding the
     terminal needs to say so explicitly. */
  #screen[hidden] { display: none; }
  #screen .xterm-viewport {
    overflow: hidden !important;
    scrollbar-width: none;
  }
  #screen .xterm-viewport::-webkit-scrollbar { display: none; }

  footer {
    position: relative;
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 16px 13px;
  }
  footer::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: -1px;
    height: 3px;
    background: var(--rainbow);
    background-size: 220% 100%;
    animation: wig 14s linear infinite reverse;
  }

  #pending:not(:empty) {
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ticket {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 12px;
    font-size: 12.5px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px dashed var(--face);
    border-radius: 8px;
  }
  .ticket .num {
    font-weight: 800;
    color: var(--face);
    font-variant-numeric: tabular-nums;
  }
  .ticket .what { color: var(--muted); }
  .ticket .said { overflow-wrap: anywhere; }

  /* Past the gate and only waiting on the session, which is a different thing
     from waiting on the host: nothing here needs anyone to do anything. */
  .ticket.out { border-style: solid; border-color: var(--line); }
  .ticket.out .num { color: var(--wig-4); }
  .ticket.out.mine { border-color: #1d5c37; }
  .ticket.out.sending { border-color: var(--wig-4); }
  .ticket.out.sending .what { color: var(--wig-4); }
  .ticket.out.held .what { color: var(--face); }

  .tab {
    cursor: pointer;
    font-family: inherit;
    color: var(--muted);
  }
  .tab:hover { border-color: var(--wig-6); color: var(--text); }
  .tab.on { color: var(--wig-6); border-color: var(--wig-6); }
  .tab .count {
    margin-left: 5px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--wig-6);
    color: #150a26;
    font-size: 11px;
  }

  #history {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: #0b0910;
    padding: 18px 0 26px;
  }
  #history[hidden] { display: none; }

  /* farce-to-farce: the lane between the clowns. clown to clown is what claude
     hears, and this is deliberately not that, so it never touches the pane. */
  #f2f {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #0b0910;
  }
  #f2f[hidden] { display: none; }
  #f2f-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 0;
  }
  .lane-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .line { display: flex; gap: 10px; align-items: baseline; line-height: 1.5; }
  .line .from {
    flex: none;
    min-width: 96px;
    text-align: right;
    font-weight: 700;
    color: var(--wig-6);
    overflow-wrap: anywhere;
  }
  .line.mine .from { color: var(--wig-4); }
  .line.host .from { color: var(--nose); }
  .line .said { flex: 1; overflow-wrap: anywhere; white-space: pre-wrap; }
  .line .at { flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lane-empty { color: var(--muted); text-align: center; padding: 40px 0; }

  #f2f-form {
    display: flex;
    gap: 10px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 12px 20px 6px;
  }
  #f2f-form input {
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  #f2f-form input:focus { outline: none; border-color: var(--wig-6); }
  #f2f-form button {
    padding: 10px 20px;
    border-radius: 999px;
    border: none;
    background: var(--wig-6);
    color: #150a26;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }
  #f2f-form button:hover { filter: brightness(1.12); }
  .lane-note {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .lane-note b { color: var(--wig-6); font-weight: 700; }

  .history-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .turn { display: flex; flex-direction: column; gap: 6px; }
  .turn .who {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    align-self: flex-start;
    width: auto;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    background: var(--panel-2);
    text-align: left;
  }
  .turn.user .who { color: var(--face); }
  .turn.assistant .who { color: var(--wig-5); }
  .turn .body {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.55;
    color: var(--text);
  }
  .turn.user .body {
    padding: 10px 14px;
    border-radius: 10px;
    border-left: 3px solid var(--face);
    background: var(--panel);
  }
  .turn .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .turn .tool {
    padding: 2px 9px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .history-empty {
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
  }

  #keypad {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    padding: 8px 12px;
    border: 1px dashed var(--wig-5);
    border-radius: 10px;
    background: var(--panel-2);
  }
  #keypad[hidden] { display: none; }
  .keypad-label {
    margin-right: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--wig-5);
  }
  #keypad button {
    min-width: 34px;
    padding: 6px 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  #keypad button:hover:not(:disabled) { border-color: var(--wig-5); }
  #keypad button.go { background: var(--wig-4); border-color: var(--wig-4); color: #06240f; }
  #keypad button:disabled { opacity: .35; cursor: not-allowed; }

  .ring-btn {
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .ring-btn.go { background: var(--wig-4); border-color: var(--wig-4); color: #06240f; }
  .ring-btn:hover { filter: brightness(1.15); }

  /* The whiteface runs the ring, so the mode badge becomes its switch. */
  body.whiteface #mode { cursor: pointer; }
  body.whiteface #mode::after { content: ' ⇄'; opacity: .7; }

  #composer { display: flex; gap: 10px; }
  #composer input[type=text] {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  #composer input[type=text]:focus { outline: none; border-color: var(--nose); }
  #composer input[type=text]::placeholder { color: var(--muted); }

  #send {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 11px 20px;
    border-radius: 999px;
    border: none;
    background: var(--nose);
    color: #fff;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }
  #send:hover:not(:disabled) { filter: brightness(1.12); }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  #send .nose {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #fff;
    box-shadow: inset -2px -2px 0 #ffffff55;
  }

  .hint { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .hint b { color: var(--face); font-weight: 700; }

  @media (max-width: 640px) {
    .brand .name { display: none; }
    .who { width: 110px; }
  }
</style>
</head>
<body>
  <header class="dots">
    <div class="brand">
      <span class="clown">🤡</span>
      <span class="name">c2c<b>-</b>conv</span>
      <span class="clown mirror">🤡</span>
    </div>
    <div class="badge" id="mode"><span class="dot"></span><span id="mode-text">connecting</span></div>
    <div class="badge link down" id="link">offline</div>
    <div class="spacer"></div>
    <button type="button" id="f2f-toggle" class="badge tab">f2f</button>
    <button type="button" id="history-toggle" class="badge tab">history</button>
    <input type="text" id="who" class="who" maxlength="40" placeholder="your name" aria-label="Your name">
  </header>

  <div id="screen"></div>

  <div id="history" hidden>
    <div class="history-inner" id="history-list"></div>
  </div>

  <div id="f2f" hidden>
    <div id="f2f-scroll"><div class="lane-inner" id="f2f-list"></div></div>
    <form id="f2f-form">
      <input type="text" id="f2f-text" maxlength="2000" autocomplete="off"
             placeholder="say something to the clowns..." aria-label="Say something to the clowns">
      <button type="submit">Say</button>
    </form>
    <div class="lane-note">
      <b>farce-to-farce.</b> clown to clown is what claude hears. This is not that:
      nothing said here is sent, queued or transcribed.
    </div>
  </div>

  <footer class="dots">
    <div id="keypad" hidden>
      <span class="keypad-label">🤡 the session is asking</span>
      <button type="button" data-key="Up">↑</button>
      <button type="button" data-key="Down">↓</button>
      <button type="button" data-key="Left">←</button>
      <button type="button" data-key="Right">→</button>
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" class="go" data-key="Enter">Enter</button>
      <button type="button" data-key="Escape">Esc</button>
    </div>
    <div id="outbox"></div>
    <div id="pending"></div>
    <form id="composer">
      <input type="text" id="text" placeholder="Say something to the session..." autocomplete="off">
      <button type="submit" id="send"><span class="nose"></span>Send</button>
    </form>
    <div class="hint" id="hint"></div>
  </footer>

  <script type="module" src="/client.ts"></script>
</body>
</html>
