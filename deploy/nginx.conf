# nginx does NOT pass an Upgrade through by default. Without the two Upgrade
# headers below the handshake returns 200 instead of 101 and every guest sits
# at "offline" retrying, which looks like a broken broker rather than a proxy
# misconfiguration.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 443 ssl;
	http2 on;
	server_name broker.example.com;

	ssl_certificate     /etc/letsencrypt/live/broker.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/broker.example.com/privkey.pem;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# A watching guest sends nothing for long stretches. The default 60s
		# read timeout would close healthy connections; the broker's own
		# heartbeat is what detects dead ones.
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
		proxy_buffering off;
	}
}
