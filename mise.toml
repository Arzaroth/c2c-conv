[tools]
node = "24"

# TypeScript now, so there is a compile step: sources in src/, bigtop/ and
# test/ build to dist/. Everything that runs code depends on it.
[tasks.build]
description = "Compile TypeScript to dist/"
run = """
cd "{{config_root}}"
npm exec --no -- tsc -p tsconfig.json
# tsc keeps the shebang but not the mode bit, and c2c is normally a symlink to
# dist/src/cli.js. Without this every rebuild breaks whatever is on PATH.
chmod +x dist/src/cli.js dist/bigtop/server.js
"""

[tasks.check]
description = "Type-check everything without emitting"
run = """
cd "{{config_root}}"
npm exec --no -- tsc --noEmit -p tsconfig.json
echo "everything type-checks"
"""

[tasks.install]
description = "Put c2c on your PATH (~/.local/bin/c2c)"
depends = ["build"]
run = """
mkdir -p "$HOME/.local/bin"
ln -sf "{{config_root}}/dist/src/cli.js" "$HOME/.local/bin/c2c"
chmod +x "{{config_root}}/dist/src/cli.js"
echo "c2c -> {{config_root}}/dist/src/cli.js"
command -v c2c >/dev/null && echo "on PATH: $(command -v c2c)" || echo "warning: ~/.local/bin is not on your PATH"
"""

[tasks.uninstall]
description = "Remove the c2c symlink"
run = 'rm -f "$HOME/.local/bin/c2c" && echo "removed"'

[tasks.test]
description = "Run the whole suite"
depends = ["build"]
run = 'node --test "{{config_root}}/dist/test/*.test.js"'

[tasks.host]
description = "Share a session here, over a cloudflared tunnel"
depends = ["build"]
run = 'node "{{config_root}}/dist/src/cli.js" host --tunnel'

[tasks.local]
description = "Share a session here, loopback only (guest forwards a port)"
depends = ["build"]
run = 'node "{{config_root}}/dist/src/cli.js" host'

[tasks.bigtop]
description = "Run a rendezvous bigtop on :8080"
depends = ["build"]
run = 'node "{{config_root}}/dist/bigtop/server.js" --port 8080 --bind 127.0.0.1'

[tasks.zavatta]
description = "Join the running session as an AI bozo (MCP, stdio)"
depends = ["build"]
run = 'node "{{config_root}}/dist/src/cli.js" zavatta'

[tasks.status]
description = "Who is connected and what is waiting"
run = 'node "{{config_root}}/dist/src/cli.js" ctl status'

[tasks.invite]
description = "Reprint the bozo instructions"
run = 'node "{{config_root}}/dist/src/cli.js" invite'

[tasks.stop]
description = "Tear the session down"
run = 'node "{{config_root}}/dist/src/cli.js" stop'

[tasks."docker:build"]
description = "Build the c2c image, with the image user matching yours"
run = 'docker build --build-arg UID="$(id -u)" --build-arg GID="$(id -g)" -t c2c-conv "{{config_root}}"'

[tasks."docker:host"]
description = "Share the current directory headless from a container, over a tunnel"
run = 'C2C_UID="$(id -u)" C2C_GID="$(id -g)" docker compose -f "{{config_root}}/compose.yaml" up'
